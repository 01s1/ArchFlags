name: ArchFlags
main: gg.arch.archflags.ArchFlagsPlugin
version: '${version}'
api-version: '1.21'
author: ARCH
description: Detects a player's country from their Velocity-forwarded IP and exposes PlaceholderAPI placeholders for an above-head nametag flag. Never touches TAB, chat, or the player list directly.
website: https://github.com/ARCH

softdepend: [PlaceholderAPI, LuckPerms]

commands:
  flags:
    description: Toggle your own country flag visibility.
    usage: /flags [on|off|toggle]
    aliases: [flag]
  archflags:
    description: ArchFlags admin commands.
    usage: /archflags <reload|lookup|status>
    permission: archflags.admin

permissions:
  archflags.use:
    description: Allows use of /flags to control your own flag visibility.
    default: true
  archflags.admin:
    description: Allows use of /archflags admin subcommands.
    default: op
