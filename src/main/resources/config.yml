# ArchFlags configuration
# ------------------------------------------------------------------
# ArchFlags ONLY provides data + PlaceholderAPI placeholders for the
# player's above-head nametag. It never edits TAB, chat, the player
# list, scoreboards, bossbars or titles by itself. See README.md.

debug: false

geoip:
  # Relative to the plugin's data folder: plugins/ArchFlags/GeoLite2-Country.mmdb
  database-file: "GeoLite2-Country.mmdb"

display:
  # CUSTOM_GLYPH, UNICODE, or COUNTRY_CODE
  mode: CUSTOM_GLYPH
  # Used automatically if CUSTOM_GLYPH assets/mapping are unavailable, so players
  # never see broken-square tofu glyphs.
  fallback-mode: COUNTRY_CODE
  unknown-code: "UN"
  unknown-country: "Unknown"
  # What %archflags_flag% resolves to when the country can't be resolved.
  # Leave blank to hide unknown countries entirely instead of showing [UN].
  unknown-flag: "[UN]"
  add-space-before-flag: true

nametag:
  # Used to build %archflags_nametag_suffix%. Only applied when a flag is
  # actually shown (visible + resolvable) -- otherwise the suffix is "".
  separator: " | "

# Wraps the glyph placeholder output in a MiniMessage <font:...> tag, so TAB
# (or any MiniMessage-aware renderer) picks the right custom font for the
# glyph automatically. Only used in CUSTOM_GLYPH mode. See README.md ->
# "TAB integration" for how to reference this in TAB's nametag config.
#
# IMPORTANT: E200-E2F9 is ArchFlags' own, separate private-use-area range.
# NxRanks uses E9xx for its own glyphs on this network -- never change
# start-codepoint to something inside E900-E9FF, and never merge these
# generated assets into NxRanks' resource pack (see resourcepack: below and
# README.md). If you do change this, re-run tools/asset-generator and update
# nothing else here manually -- the mapping file is regenerated for you.
glyphs:
  start-codepoint: "E200"
  mapping-file: "glyph-mapping.yml"
  wrap-minimessage: true
  font-key: "archflags:flags"

# ArchFlags' own, fully independent Java resource pack (never merged into NxRanks'). Sent
# additively alongside whatever pack(s) NxRanks already sends -- it is never replaced by an
# NxRanks update, and updating NxRanks never removes it. Only used in CUSTOM_GLYPH mode; leave
# resourcepack.java.enabled: false if you only use UNICODE/COUNTRY_CODE modes.
#
# The Bedrock pack is NOT sent by this plugin -- Geyser reads Bedrock packs from its own
# Geyser-Velocity/packs/ folder. Copy output/ArchFlags-Bedrock.zip there by hand; see README.md.
resourcepack:
  java:
    enabled: true
    # RECOMMENDED for a real network: host output/ArchFlags-Java.zip on your own web
    # server/CDN and put that URL here. Since HUB, SMP, and SURVIVAL all ship the exact same
    # pack, point all three backends at this ONE url so you don't need a different self-host
    # port open per server. Leave blank to fall back to self-hosting instead (below).
    url: ""
    # Vanilla clients disconnect themselves if a *required* pack is rejected/fails -- leave this
    # false unless you're sure every player can actually reach the pack URL.
    required: false
    prompt: "&bArchFlags needs its small flag pack alongside your other resource packs."
    # Fallback only used when url above is blank. Fine for testing; for production, prefer an
    # externally-hosted url instead so you're not running an HTTP server on every backend.
    self-host:
      enabled: true
      bind-address: "0.0.0.0"
      # If HUB/SMP/SURVIVAL run on the same machine, each server needs its OWN port here.
      port: 25566
      # REQUIRED when self-host is enabled and url above is blank: the host/IP players'
      # clients can actually reach (your domain or public IP) -- not 0.0.0.0 or 127.0.0.1.
      public-address: ""

# Bedrock-player detection, used only to decide whether to send the Java resource pack above
# (Bedrock clients never need it -- they get ArchFlags-Bedrock.zip via Geyser instead).
#
# IMPORTANT for this network: Geyser + Floodgate run on the VELOCITY PROXY, not on this backend.
# That means Floodgate's own reliable detection API is only reachable here if the Floodgate
# plugin is ALSO installed on this backend server, with the same key.pem as the proxy's
# plugins/floodgate/key.pem -- see https://geysermc.org/wiki/floodgate/setup/proxy-servers/ and
# README.md "Bedrock detection". Startup logs say clearly which mode is active.
bedrock-detection:
  # Optional stopgap ONLY for when backend Floodgate isn't installed. NOT an officially
  # guaranteed Floodgate API -- Floodgate rewrites a Bedrock player's visible Java username with
  # this prefix on the proxy before forwarding them anywhere, so it's often still visible here,
  # but it breaks if this prefix is set to empty on the proxy. Prefer installing backend
  # Floodgate instead when you can.
  username-prefix-fallback:
    enabled: false
    # Must match Floodgate's own "username-prefix" setting on the proxy.
    prefix: "."

luckperms:
  # LuckPerms meta node used to persist flag visibility network-wide.
  # No separate database is created -- this rides on LuckPerms' existing
  # MySQL storage that's already shared across Hub/Survival/SMP.
  preference-node: "archflags.visible"

cache:
  enabled: true
  # How long a resolved country stays cached in memory after the player
  # disconnects, in minutes, before it's evicted.
  retain-after-quit-minutes: 30

messages:
  prefix: "&bArchFlags &8» &r"
  flag-enabled: "&aYour country flag is now visible."
  flag-disabled: "&cYour country flag is now hidden."
  flag-status-on: "&fCountry flag: &aON"
  flag-status-off: "&fCountry flag: &cOFF"
  flag-usage: "&cUsage: /flag <on|off|toggle|status>"
  no-permission: "&cYou do not have permission to use this command."
  player-only: "&cThis command can only be used by a player."
  player-not-found: "&cPlayer not found or never joined."
  reload-success: "&aArchFlags configuration reloaded."
  admin-lookup-header: "&7--- &bArchFlags Lookup &7---"
  admin-lookup-player: "&7Player: &f%player%"
  admin-lookup-country: "&7Country: &f%country%"
  admin-lookup-code: "&7Code: &f%code%"
  admin-lookup-visible: "&7Visible: &f%visible%"
  status-header: "&7--- &bArchFlags Status &7---"
