name: Build ArchFlags

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Regenerate Gradle wrapper jar (only if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build --stacktrace

      - name: Locate built plugin JAR
        run: find . -name "*.jar" -path "*/libs/*"

      - name: Upload ArchFlags JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArchFlags-jar
          path: build/libs/ArchFlags-*.jar

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: build/reports/
